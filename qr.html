<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البيت الشامي | QR</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Tajawal', sans-serif; background: #1a1a1a; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: #fff; border-radius: 25px; padding: 40px; text-align: center; max-width: 400px; width: 100%; }
        .logo { font-size: 2rem; font-weight: 800; color: #C9A84C; margin-bottom: 10px; }
        #qrcode { margin: 20px auto; display: inline-block; padding: 15px; border: 3px solid #C9A84C; border-radius: 15px; }
        .social { margin-top: 20px; }
        .social a { display: inline-block; margin: 5px; padding: 10px 20px; border-radius: 25px; text-decoration: none; color: #fff; font-weight: 700; }
        .fb { background: #1877F2; }
        .ig { background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); }
        .wa { background: #25D366; }
        .back { display: inline-block; margin-top: 15px; color: #C9A84C; text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">البيت الشامي</div>
        <p>امسح الكود للطلب</p>
        <div id="qrcode"></div>
        <div class="social">
            <a href="https://facebook.com/albeitshami" class="fb" target="_blank">فيسبوك</a>
            <a href="https://instagram.com/albeitshami" class="ig" target="_blank">انستغرام</a>
            <a href="https://wa.me/00963944846249" class="wa" target="_blank">واتساب</a>
        </div>
        <a href="index.html" class="back">← العودة للقائمة</a>
    </div>
    <script>
        var url = window.location.href.replace('qr.html', 'index.html');
        if(url.startsWith('file://')) url = 'https://example.com/index.html';
        new QRCode(document.getElementById("qrcode"), { text: url, width: 180, height: 180, colorDark: "#1a1a1a", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H });
    </script>
</body>
</html>
