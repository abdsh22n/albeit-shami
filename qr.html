<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البيت الشامي | QR Code</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --gold: #C9A84C;
            --gold-light: #E8D5A3;
            --gold-dark: #A0852C;
            --white: #FFFFFF;
            --black: #1A1A1A;
            --gray: #F5F5F5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, var(--black) 0%, #2D2D2D 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .qr-container {
            background: var(--white);
            border-radius: 30px;
            padding: 50px 40px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        .qr-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--gold);
            margin-bottom: 10px;
        }

        .tagline {
            color: var(--black);
            font-size: 1rem;
            margin-bottom: 30px;
        }

        .qr-wrapper {
            background: var(--white);
            padding: 20px;
            border-radius: 20px;
            display: inline-block;
            margin: 20px 0;
            border: 3px solid var(--gold);
        }

        #qrcode {
            display: flex;
            justify-content: center;
        }

        .qr-wrapper img {
            border-radius: 10px;
        }

        .instructions {
            margin-top: 25px;
            padding: 20px;
            background: var(--gray);
            border-radius: 15px;
        }

        .instructions h3 {
            color: var(--black);
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .instructions p {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.8;
        }

        .instructions .icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            color: var(--white);
            padding: 12px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(201,168,76,0.3);
        }

        .back-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(201,168,76,0.5);
        }

        .decorative-line {
            width: 60px;
            height: 3px;
            background: var(--gold);
            margin: 15px auto;
        }

        .url-display {
            margin-top: 15px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #666;
            word-break: break-all;
            direction: ltr;
        }

        .edit-url {
            margin-top: 15px;
            padding: 15px;
            background: #fff8e1;
            border-radius: 10px;
            border: 1px solid var(--gold-light);
        }

        .edit-url label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: var(--black);
        }

        .edit-url input {
            width: 100%;
            padding: 10px;
            border: 2px solid var(--gold-light);
            border-radius: 8px;
            font-family: 'Tajawal', sans-serif;
            margin-bottom: 10px;
            direction: ltr;
        }

        .edit-url button {
            background: var(--gold);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-family: 'Tajawal', sans-serif;
            font-weight: 700;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .qr-container {
                padding: 30px 20px;
            }
            .logo {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="qr-container">
        <div class="logo">البيت الشامي</div>
        <div class="decorative-line"></div>
        <p class="tagline">امسح الكود للطلب</p>

        <div class="qr-wrapper">
            <div id="qrcode"></div>
        </div>

        <div class="url-display" id="currentUrl">
            جاري تحميل الرابط...
        </div>

        <div class="edit-url">
            <label>🔗 عدّل رابط الموقع:</label>
            <input type="text" id="urlInput" placeholder="https://your-site.com/index.html">
            <button onclick="updateQR()">تحديث QR Code</button>
        </div>

        <div class="instructions">
            <div class="icon">📱</div>
            <h3>كيفية الاستخدام</h3>
            <p>
                1. افتح كاميرا هاتفك<br>
                2. وجه الكاميرا نحو QR Code<br>
                3. اضغط على الرابط الظاهر<br>
                4. اطلب ما تشتهيه!
            </p>
        </div>

        <a href="index.html" class="back-btn">العودة للقائمة</a>
    </div>

    <script>
        let qrcode = null;

        function generateQR(url) {
            // Clear previous QR
            document.getElementById("qrcode").innerHTML = '';

            qrcode = new QRCode(document.getElementById("qrcode"), {
                text: url,
                width: 200,
                height: 200,
                colorDark: "#1A1A1A",
                colorLight: "#FFFFFF",
                correctLevel: QRCode.CorrectLevel.H
            });

            document.getElementById("currentUrl").textContent = url;
            document.getElementById("urlInput").value = url;
        }

        function updateQR() {
            const newUrl = document.getElementById("urlInput").value.trim();
            if (newUrl) {
                generateQR(newUrl);
            }
        }

        // Auto-detect URL on load
        window.onload = function() {
            // Try to detect the current URL
            let currentUrl = window.location.href;

            // If it's a file:// URL (local), use a placeholder
            if (currentUrl.startsWith('file://')) {
                currentUrl = 'https://example.com/index.html';
                document.getElementById("currentUrl").innerHTML = 
                    '<span style="color: #c9a84c;">⚠️ الموقع محلي. أدخل الرابط الحقيقي أدناه 👇</span>';
            } else {
                // Replace qr.html with index.html
                currentUrl = currentUrl.replace('qr.html', 'index.html');
            }

            generateQR(currentUrl);
        };
    </script>
</body>
</html>
